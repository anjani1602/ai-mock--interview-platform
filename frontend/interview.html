<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Mock Interview</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #1d4ed8;
            margin-top: 0;
        }

        #topicDisplay {
            color: #475569;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .question-box {
            background: #eff6ff;
            border-left: 5px solid #2563eb;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .question-box h2,
        .answer-box h2 {
            margin: 0 0 10px;
            font-size: 20px;
        }

        #question {
            font-size: 17px;
            line-height: 1.6;
            margin: 0;
        }

        #answer {
            width: 100%;
            height: 250px;
            padding: 14px;
            font-size: 16px;
            font-family: inherit;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            resize: vertical;
            box-sizing: border-box;
            display: block;
        }

        #answer:focus {
            outline: none;
            border-color: #2563eb;
        }

        .buttons {
            margin-top: 20px;
        }

        .buttons button {
            padding: 12px 22px;
            font-size: 15px;
            background: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 0 8px 8px 0;
        }

        .buttons button:hover {
            background: #1d4ed8;
        }

        .result-box {
            margin-top: 25px;
            line-height: 1.6;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🤖 AI Mock Interview</h1>

        <p id="topicDisplay">
            Interview Topic
        </p>

        <div class="question-box">

            <h2>Interview Question</h2>

            <p id="question">
                AI is preparing your question...
            </p>

        </div>

        <div class="answer-box">

            <h2>Your Answer</h2>

            <textarea
                id="answer"
                rows="8"
                placeholder="Type your answer here..."
            ></textarea>

        </div>

        <div class="buttons">

            <button
                type="button"
                id="submitButton"
                onclick="submitAnswer(); return false;"
            >
                Submit Answer
            </button>

            <button
                type="button"
                id="nextButton"
                onclick="nextQuestion(); return false;"
                style="display: none;"
            >
                Next Question
            </button>

            <button
                type="button"
                onclick="openHistory(); return false;"
            >
                View History
            </button>

            <button
                type="button"
                onclick="goHome(); return false;"
            >
                Home
            </button>

        </div>

        <div
            class="result-box"
            id="result"
        >
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
